<!DOCTYPE html>
<html lang="en">
  <head>
    {% include meta.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}">
          <span class="site-logo" aria-hidden="true">&gt;_</span>
          <span class="site-title">{{ site.title }}</span>
        </a>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container site-footer-inner">
        <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
        {% include social-links.html %}
      </div>
    </footer>

    {% include analytics.html %}
  </body>
</html>
