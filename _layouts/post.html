---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% assign minutes = content | number_of_words | divided_by: 200 | at_least: 1 %}
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      <span aria-hidden="true">&middot;</span>
      {{ minutes }} min read
    </p>
  </header>

  <div class="entry">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}">&larr; All posts</a>
  </footer>

  {% include disqus.html %}
</article>
